services:
  # --- Redis (BullMQ) ---
  redis:
    image: redis:7-alpine
    container_name: mkpl-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MinIO (stockage fichiers) ---
  minio:
    image: minio/minio:latest
    container_name: mkpl-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend NestJS ---
  backend:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mkpl-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mkpl}:${DB_PASSWORD:-mkpl_secret}@postgres:5432/${DB_NAME:-marketplace3d}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretrefresh}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PLATFORM_ACCOUNT_ID: ${STRIPE_PLATFORM_ACCOUNT_ID:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-marketplace3d}
      APP_URL: ${APP_URL:-https://mktp.amirtalbi.fr}
      API_URL: ${API_URL:-https://mktp.amirtalbi.fr/api}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOVU_API_KEY: ${NOVU_API_KEY:-}
      NOVU_APP_ID: ${NOVU_APP_ID:-}
      COMMISSION_PCT: ${COMMISSION_PCT:-0.03}
      COMMISSION_FIXED_CENTS: ${COMMISSION_FIXED_CENTS:-80}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run start:dev"
    networks:
      - default
      - infra-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra-network"
      - "traefik.http.routers.mkpl-backend.rule=Host(`mktp.amirtalbi.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.mkpl-backend.entrypoints=websecure"
      - "traefik.http.routers.mkpl-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.mkpl-backend.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.mkpl-backend-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.mkpl-backend.middlewares=mkpl-backend-stripprefix"

  # --- Frontend Nuxt (dev server) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mkpl-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${API_URL:-https://mktp.amirtalbi.fr/api}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    command: npm run dev
    networks:
      - default
      - infra-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra-network"
      - "traefik.http.routers.mkpl-frontend.rule=Host(`mktp.amirtalbi.fr`)"
      - "traefik.http.routers.mkpl-frontend.entrypoints=websecure"
      - "traefik.http.routers.mkpl-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.mkpl-frontend.loadbalancer.server.port=3000"

  pgadmin:
    image: elestio/pgadmin:latest
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@root.me
      - PGADMIN_DEFAULT_PASSWORD=rootroot
      - PGADMIN_LISTEN_PORT=8888
    ports:
      - "8888:8888"
    volumes:
      - ./servers.json:/pgadmin4/servers.json

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  infra-network:
    external: true
