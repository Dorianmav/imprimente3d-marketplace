services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: mkpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mkpl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mkpl_secret}
      POSTGRES_DB: ${DB_NAME:-marketplace3d}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-mkpl} -d ${DB_NAME:-marketplace3d}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis (BullMQ) ---
  redis:
    image: redis:7-alpine
    container_name: mkpl-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MinIO (stockage fichiers) ---
  minio:
    image: minio/minio:latest
    container_name: mkpl-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend NestJS ---
  backend:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mkpl-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mkpl}:${DB_PASSWORD:-mkpl_secret}@postgres:5432/${DB_NAME:-marketplace3d}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretrefresh}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PLATFORM_ACCOUNT_ID: ${STRIPE_PLATFORM_ACCOUNT_ID:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-marketplace3d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOVU_API_KEY: ${NOVU_API_KEY:-}
      NOVU_APP_ID: ${NOVU_APP_ID:-}
      COMMISSION_PCT: ${COMMISSION_PCT:-0.03}
      COMMISSION_FIXED_CENTS: ${COMMISSION_FIXED_CENTS:-80}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run start:dev"

  # --- Frontend Nuxt (dev server) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mkpl-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001
      API_BASE_SERVER: http://backend:3001
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    command: npm run dev

  # --- Traefik (reverse proxy) ---
  traefik:
    image: traefik:latest
    container_name: mkpl-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"

  pgadmin:
    image: elestio/pgadmin:latest
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@root.me
      - PGADMIN_DEFAULT_PASSWORD=rootroot
      - PGADMIN_LISTEN_PORT=8888
    ports:
      - "8888:8888"
    volumes:
      - ./servers.json:/pgadmin4/servers.json

volumes:
  postgres_data:
  redis_data:
  minio_data:
  traefik_certs:
